name: Deploy flask app on ec2

on:
  workflow_dispatch:
    
env:
  IMAGE_NAME: flask-app-gitactions    
  CONTAINER_NAME: flask-app-gitactions
  APP_PORT: 5000

jobs:
  deploy: 
    runs-on: self-hosted
    steps:
      - name: Dockerhub login
        run: |
          echo "{{secrets.DOCKER_PASSWORD}}" | docker login -u "${secrets.DOCKER_USER}}" --password-stdin
      - name: Docker pull
        run: docker pull ${{secrets.DOCKER_USER}}/$IMAGE_NAME:latest

      - name: Container stop 
        run: docker stop $CONTAINER_NAME || true

      - name: Cotainer remove 
        run: docker rm $CONTAINER_NAME || true

      - name: Run New Container
        run: |
          docker run -d --name $CONTAINER_NAME -p 5000:5000 \
            ${{ secrets.DOCKER_USER }}/$IMAGE_NAME:latest

      - name: Verify Running Container
        run: docker ps