name: Flask Docker Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: flask-app-gitactions

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout-repository
        uses: actions/checkout@v4

      - name: build docker image 
        run: docker build -t $IMAGE_NAME .

      - name: Dockerlogin
        run: echo "${{secrets.DOCKER_PASSWORD}}" | docker login -u "${{secrets.DOCKER_USER}}" --password-stdin
      - name: dockerimagetag
        run:  docker tag $IMAGE_NAME "${{secrets.DOCKER_USER}}"/$IMAGE_NAME:latest

      - name : docker push
        run: docker push "${{secrets.DOCKER_USER}}"/$IMAGE_NAME:latest   
              
        
          
