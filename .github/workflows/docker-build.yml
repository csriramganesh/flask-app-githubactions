name: Flask Docker Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: flask-app-gitactions

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout-repository
        uses: actions/checkout@v4

      - name: build docker image 
        run: docker build -t $IMAGE_NAME .
        
          